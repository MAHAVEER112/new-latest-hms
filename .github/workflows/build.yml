
name: Build CarePoint APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout GitHub repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Skip Android lint crash
      - name: Skip Android lint crash
        run: |
          mkdir -p ~/.gradle/init.d

          cat > ~/.gradle/init.d/nolint.gradle <<'EOT'
          allprojects {
              tasks.configureEach { t ->
                  if (t.name.startsWith('lintVital')) {
                      t.enabled = false
                  }
              }
          }
          EOT

      # 5. Extract project ZIP
      - name: Prepare project
        run: |
          echo "Checking ZIP file..."

          if [ ! -f "carepoint_local.zip" ]; then
            echo "ERROR: carepoint_local.zip not found!"
            ls -la
            exit 1
          fi

          echo "Extracting CarePoint project..."

          unzip -q carepoint_local.zip

          if [ ! -f "carepoint_local/pubspec.yaml" ]; then
            echo "ERROR: Flutter project folder not found!"
            find . -maxdepth 3 -name pubspec.yaml
            exit 1
          fi

          cd carepoint_local

          echo "Preparing Android project..."

          flutter create --platforms=android .

          sh tools/patch_manifest.sh

          flutter pub get

      # 6. Analyze Flutter code
      - name: Check code
        working-directory: carepoint_local
        continue-on-error: true
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings

      # 7. Build Release APK
      - name: Build APK
        working-directory: carepoint_local
        run: |
          flutter build apk --release

      # 8. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carepoint-apk
          path: carepoint_local/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
